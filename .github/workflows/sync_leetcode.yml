name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Get current IST time
        run: |
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV
          echo "NOW=$(TZ=Asia/Kolkata date '+%d %b %Y %I:%M:%S %p IST')" >> $GITHUB_ENV

      - name: Sync LeetCode
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions
          verbose: true
          commit-header: "[LeetCode | ${{ env.NOW }}]"
